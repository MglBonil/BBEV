<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluno A</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }
        @media (max-width: 480px) {
            .form-card { padding: 20px 16px !important; }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-2xl p-8 form-card">

        <div class="flex flex-col md:flex-row gap-8">

            <!-- COLUNA ESQUERDA: DADOS DO ALUNO -->
            <div class="flex gap-4 md:w-1/3 md:border-r md:pr-8 border-gray-200">

                <div class="w-14 h-14 rounded-full bg-blue-600 flex items-center justify-center shrink-0">
                    <img src="../../assets/icons/person.svg" class="w-7 h-7" alt="">
                </div>

                <div>
                    <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        Aluno A
                        <span class="text-xs font-semibold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded-full">
                            Ativo
                        </span>
                    </h1>

                    <p class="text-sm text-gray-500 mb-4">RM: 12345</p>

                    <p class="text-xs text-gray-400 mb-1">Curso</p>
                    <p class="text-sm font-medium text-slate-700">Ensino Médio – Integral</p>
                </div>

            </div>

            <!-- COLUNA DIREITA: PONTOS E AÇÕES -->
            <div class="flex-1 flex flex-col gap-5">

                <div class="flex flex-col sm:flex-row gap-4">

                    <div class="flex-1 bg-blue-50 rounded-lg px-5 py-3">
                        <p class="text-xs text-gray-500 mb-1">Pontos atuais</p>
                        <p class="text-2xl font-bold text-blue-600" id="pontosAtuais">99</p>
                    </div>

                    <div class="flex-1 bg-gray-50 rounded-lg px-5 py-3">
                        <p class="text-xs text-gray-500 mb-1 flex items-center gap-1">
                            
                            Última atualização
                        </p>
                        <p class="text-sm font-semibold text-slate-700">05/08/2025 – 14:32</p>
                    </div>

                </div>

                <form id="formPontos" class="flex flex-col sm:flex-row gap-4 sm:items-end">

                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1.5">Tipo</label>
                        <select id="tipoAlteracao"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option>Justificativa</option>
                            <option>Bônus</option>
                            <option>Penalidade</option>
                        </select>
                    </div>

                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1.5">Alterar pontos</label>
                        <div class="flex items-stretch border border-gray-300 rounded-lg overflow-hidden">
                            <button type="button" onclick="alterarPontos(-1)"
                                class="w-10 flex items-center justify-center text-blue-600 hover:bg-blue-50 font-bold">
                                −
                            </button>
                            <input id="deltaPontos" type="text" value="0" readonly
                                class="w-full text-center border-x border-gray-300 text-sm text-slate-700 outline-none">
                            <button type="button" onclick="alterarPontos(1)"
                                class="w-10 flex items-center justify-center text-blue-600 hover:bg-blue-50 font-bold">
                                +
                            </button>
                        </div>
                    </div>

                    <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow-md whitespace-nowrap">
                        Enviar
                    </button>

                </form>

                <button type="button" onclick="excluirUsuario()"
                    class="w-full flex items-center justify-center gap-2 border border-red-300 text-red-600 hover:bg-red-50 font-semibold py-2.5 rounded-lg">
                    <img src="../../assets/icons/delete.svg" class="w-4 h-4" alt="">
                    Excluir usuário
                </button>

            </div>

        </div>

    </div>

    <script src="../../assets/js/config.js"></script>
    <script type="module" src="../../assets/js/pages/aluno.js"></script>
    <script>
        function alterarPontos(delta) {
            const input = document.getElementById("deltaPontos");
            input.value = parseInt(input.value) + delta;
        }

        function excluirUsuario() {
            if (confirm("Tem certeza que deseja excluir este usuário?")) {
                // lógica de exclusão
            }
        }

        document.getElementById("formPontos").addEventListener("submit", function (e) {
            e.preventDefault();
            const tipo = document.getElementById("tipoAlteracao").value;
            const delta = parseInt(document.getElementById("deltaPontos").value);
            // lógica de envio
        });
    </script>

</body>

</html>
